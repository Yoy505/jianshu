# 此文件应作为一个整体放在 Nginx 的 http {} include 目录中，
# 例如 /etc/nginx/conf.d/singlin.conf。不要与 bootstrap/旧模板同时启用。
# 证书用 certbot --cert-name singlin.cn 签发，须覆盖以下三个子域。

limit_req_zone $binary_remote_addr zone=occupational_upload_rate:10m rate=1r/m;
limit_conn_zone $binary_remote_addr zone=occupational_upload_conn:10m;

server {
    listen 80;
    server_name mp.singlin.cn essay.singlin.cn admin.singlin.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / { return 301 https://$host$request_uri; }
}

# 主域未签证书，HTTP 直接跳转到征集站；ACME 路径保留以便日后为主域签发。
server {
    listen 80;
    server_name singlin.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / { return 301 https://essay.singlin.cn$request_uri; }
}

server {
    listen 443 ssl;
    server_name mp.singlin.cn;
    ssl_certificate /etc/letsencrypt/live/singlin.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/singlin.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;

    location = /health { proxy_pass http://127.0.0.1:8000/health; }

    location ^~ /api/v1/mp/ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /uploads/exports { return 404; }
    location ^~ /uploads/exports/ { return 404; }
    location /uploads/ { proxy_pass http://127.0.0.1:8000; }

    add_header X-Content-Type-Options nosniff always;
}

server {
    listen 443 ssl;
    server_name essay.singlin.cn;
    ssl_certificate /etc/letsencrypt/live/singlin.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/singlin.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /www/wwwroot/singlin/essay-h5;
    index index.html;
    client_max_body_size 320m;

    # 已下线的文学站深链不做 SPA 回退。
    location = /literary { return 410; }
    location ^~ /literary/ { return 410; }
    location = /essay { return 410; }
    location ^~ /essay/ { return 410; }
    location = /my { return 410; }
    location ^~ /my/ { return 410; }
    location = /privacy { return 410; }
    location ^~ /privacy/ { return 410; }
    location = /terms { return 410; }
    location ^~ /terms/ { return 410; }

    location = /api/v1/h5/occupational-submissions {
        limit_req zone=occupational_upload_rate burst=5 nodelay;
        limit_req_status 429;
        limit_conn occupational_upload_conn 2;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /api/v1/h5/occupational-submissions/ { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|woff2?)$ { expires 30d; }
    add_header X-Content-Type-Options nosniff always;
}

server {
    listen 443 ssl;
    server_name admin.singlin.cn;
    ssl_certificate /etc/letsencrypt/live/singlin.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/singlin.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /www/wwwroot/singlin/admin-web;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|woff2?)$ { expires 30d; }
    add_header X-Content-Type-Options nosniff always;
}
