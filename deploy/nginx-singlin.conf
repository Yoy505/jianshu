# 杏临汇 · Nginx 站点配置模板
# 主域：singlin.cn（2026-09-22 定稿，备案主体：健树科技（天津）有限公司）
# 拓扑对齐 ClinInsOS：宝塔 + Supervisor(uvicorn 127.0.0.1:8000) + Nginx 反代
#
# 三个 server 块分站点；SSL 证书签发后把 443 段的证书路径填上。
# 证书（宝塔或 certbot webroot 二选一）：
#   certbot certonly --webroot -w /www/wwwroot/essay.singlin.cn \
#     -d mp.singlin.cn -d essay.singlin.cn -d admin.singlin.cn \
#     --non-interactive --agree-tos -m admin@jianshu.example --no-eff-email
#
# API（含 WebSocket）：
#   Nginx 层必须为 WS 加 Upgrade 头（map $http_upgrade），否则咚咚实时通道连不上。

# ─────────── WebSocket / HTTP 升级映射（放 http 级，宝塔下放 conf.d 或站点文件顶部无 map 时放 nginx.conf）───────────
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }

# 以下两个 zone 必须放在 nginx.conf 的 http {} 中；若宝塔只允许编辑单个
# server {}，先把 zone 加到 http {}，再使用下方作者站的上传 location。
# 在解析 300 MiB multipart 前限制匿名上传频率和并发。
limit_req_zone $binary_remote_addr zone=occupational_upload_rate:10m rate=1r/m;
limit_conn_zone $binary_remote_addr zone=occupational_upload_conn:10m;

# ─────────── ① mp.singlin.cn → FastAPI（API + WS + 静态上传）───────────
server {
    listen 80;
    server_name mp.singlin.cn;
    # 备案通过前先用 IP 联调时：server_name 可临时写 _ 或服务器 IP

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # WebSocket：/api/v1/mp/ws（Upgrade 头必带，读超时拉长保活）
    location /api/v1/mp/ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 旧版导出曾位于公开上传目录；代理层也必须阻断历史文件。
    location = /uploads/exports { return 404; }
    location ^~ /uploads/exports/ { return 404; }

    # 普通上传文件静态访问
    location /uploads/ {
        alias /www/wwwroot/singlin/backend/uploads/;
        expires 7d;
    }

    location = /health { proxy_pass http://127.0.0.1:8000/health; }

    add_header X-Content-Type-Options nosniff;
}

# ─────────── ② essay.singlin.cn → 征文 H5 静态站 ───────────
server {
    listen 80;
    server_name essay.singlin.cn;
    root /www/wwwroot/singlin/essay-h5;
    index index.html;
    # 视频投稿上限 300 MiB；留出 multipart 开销。实际内容仍由 API 校验。
    client_max_body_size 320m;

    # 旧文学站深链已下线；在 SPA 回退前返回 HTTP 410，避免旧内容继续被索引。
    location = /literary { return 410; }
    location ^~ /literary/ { return 410; }
    location = /essay { return 410; }
    location ^~ /essay/ { return 410; }
    location = /my { return 410; }
    location ^~ /my/ { return 410; }
    location = /privacy { return 410; }
    location ^~ /privacy/ { return 410; }
    location = /terms { return 410; }
    location ^~ /terms/ { return 410; }

    # 精确上传路径先限速/限并发，再接收请求体；防止大文件在 FastAPI
    # Form/File 解析阶段绕过路由内部的开关与 Redis 限流。
    location = /api/v1/h5/occupational-submissions {
        limit_req zone=occupational_upload_rate burst=5 nodelay;
        limit_req_status 429;
        limit_conn occupational_upload_conn 2;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /api/v1/h5/occupational-submissions/ { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;   # SPA 回退
    }
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|woff2?)$ { expires 30d; }
    add_header X-Content-Type-Options nosniff;
}

# ─────────── ③ admin.singlin.cn → 管理后台静态站 ───────────
server {
    listen 80;
    server_name admin.singlin.cn;
    root /www/wwwroot/singlin/admin-web;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ { expires 30d; }
    add_header X-Content-Type-Options nosniff;
}

