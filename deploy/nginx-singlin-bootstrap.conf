# 首次签发证书时使用。作为一个独立文件放入 Nginx 的 http {} include 目录，
# 例如 /etc/nginx/conf.d/singlin.conf；签发后替换成 nginx-singlin-production.conf。
# 此时域名只提供 ACME 校验，不开放业务页面。
server {
    listen 80;
    server_name mp.singlin.cn essay.singlin.cn admin.singlin.cn singlin.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / { return 503; }
}
